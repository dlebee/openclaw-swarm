name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Linux + Windows (cross-compiled from Ubuntu)
  # -------------------------------------------------------------------------
  build-xcompile:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build claws (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/claws-${{ matrix.name }}
          BIN_NAME="claws${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/claws-${{ matrix.name }}/${BIN_NAME}" \
            ./cmd/cli

      - name: Package archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          NAME="claws-${VERSION}-${{ matrix.name }}"
          mv "claws-${{ matrix.name }}" "${NAME}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${NAME}.zip" "${NAME}"
            echo "asset=${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: claws-${{ matrix.name }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # macOS (build on macos-latest so we can codesign + notarize)
  # -------------------------------------------------------------------------
  build-macos:
    name: Build darwin-${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            name: darwin-amd64
          - goarch: arm64
            name: darwin-arm64

    env:
      # Lift secrets into env so `if:` expressions can check presence.
      MACOS_CERT_P12_BASE64:  ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD:    ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      AC_APPLE_ID:            ${{ secrets.AC_APPLE_ID }}
      AC_APP_PASSWORD:        ${{ secrets.AC_APP_PASSWORD }}
      AC_TEAM_ID:             ${{ secrets.AC_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build claws (darwin/${{ matrix.goarch }})
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/claws-${{ matrix.name }}
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/claws-${{ matrix.name }}/claws" \
            ./cmd/cli

      # --- Signing -------------------------------------------------------
      - name: Import Developer ID certificate into temp keychain
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # Generate an ephemeral password for the temp keychain.
          # The keychain only exists for this job and is deleted at the end,
          # so this password protects nothing long-lived.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Make our keychain the default search path, keeping the login keychain.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "Signing identities visible:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Codesign claws (hardened runtime)
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          BIN="dist/claws-${{ matrix.name }}/claws"

          /usr/bin/codesign \
            --force \
            --timestamp \
            --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$BIN"

          /usr/bin/codesign --verify --strict --verbose=2 "$BIN"
          /usr/bin/codesign --display --verbose=2 "$BIN" || true

      # --- Notarization --------------------------------------------------
      - name: Notarize with notarytool
        if: env.MACOS_CERT_P12_BASE64 != '' && env.AC_APPLE_ID != '' && env.AC_APP_PASSWORD != '' && env.AC_TEAM_ID != ''
        run: |
          set -euo pipefail
          BIN="dist/claws-${{ matrix.name }}/claws"
          ZIP="$RUNNER_TEMP/claws-${{ matrix.name }}-notarize.zip"

          /usr/bin/ditto -c -k --keepParent "$BIN" "$ZIP"

          xcrun notarytool submit "$ZIP" \
            --apple-id "$AC_APPLE_ID" \
            --password "$AC_APP_PASSWORD" \
            --team-id  "$AC_TEAM_ID" \
            --wait \
            --timeout 30m

          rm -f "$ZIP"

          # Nothing to staple for a bare binary — Gatekeeper checks online on
          # first run. (Stapling only works on .app / .dmg / .pkg bundles.)

      # --- Clean up keychain regardless of success ----------------------
      - name: Delete temp keychain
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      # --- Package & upload ---------------------------------------------
      - name: Package archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          NAME="claws-${VERSION}-${{ matrix.name }}"
          mv "claws-${{ matrix.name }}" "${NAME}"
          tar -czf "${NAME}.tar.gz" "${NAME}"
          echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: claws-${{ matrix.name }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Publish a GitHub Release with all artifacts + checksums
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-xcompile, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          ls -la
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
