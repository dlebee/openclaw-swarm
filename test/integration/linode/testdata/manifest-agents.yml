# Linode provisioning + security + gateway + channels + agents
# smoke-test manifest.
#
# Mirror of the Multipass tier's manifest-agents.yml with Linode
# specifics (sku / image / region). The meaningful test parameters
# — one machine, one gateway named `gateway`, one telegram channel,
# one agent with tools.elevated + identity + bindings — are
# identical. If either manifest drifts the tests stop being
# equivalent and the "this works on real cloud too" value-add of
# the Linode tier erodes into a nearly-identical-but-subtly-
# different scenario.
#
# Why mirror the single-agent single-channel shape exactly:
#
#   The agents phase's cross-provider value-add isn't about topology
#   (covered by TestNodeSmoke's mesh coverage, which already proves
#   headscale/sslip work). It's about `npm install -g openclaw`
#   resolving the same agents CLI surface from the public registry
#   AND the same `openclaw.json` schema being written on real cloud
#   infrastructure. Those don't depend on how many agents are
#   declared — one is enough to cover every step of the agents phase.
#
# Why g6-standard-1 (1 vCPU / 2 GiB) not the cheaper g6-nanode-1:
#
#   Same reason as manifest-channels.yml — each `openclaw agents
#   add` / `openclaw config set` pays a cold TypeScript startup
#   tax on the first invocation. Nanode's 1 GiB is right on the
#   OOM edge; standard-1 matches every other Linode fixture so the
#   tier's mechanical shape stays uniform.
#
# About the omitted networking: block:
#
#   Same rationale as manifest-gateway.yml / manifest-channels.yml:
#   nil networking → NeedsLANBind false → daemon binds 127.0.0.1:
#   18789. On a public-IP Linode instance this is the critical
#   security invariant — the agents phase running after channels
#   must NOT flip the bind to 0.0.0.0. TestAgentsSmoke re-asserts
#   the loopback check AFTER agents apply specifically to catch
#   that.

prefix: claws-it-linode-agents

machines:
  - name: gateway-host
    type: linode
    sku: g6-standard-1
    image: linode/ubuntu24.04
    region: us-east
    bootstrap_user: root
    agent_user: agent

gateways:
  - name: gateway
    reference: gateway-host
    channels:
      - kind: telegram
        name: telegram-main
        token_env: TELEGRAM_MAIN_BOT_TOKEN
        default: true

agents:
  - id: main
    gateway: gateway
    model: { primary: "anthropic/claude-sonnet-4-6" }
    tools:
      elevated:
        enabled: true
        allow_from:
          telegram: ["6609699762"]
    soul: |
      You are the smoke-test agent. You exist to prove the agents
      phase of claws apply lands config correctly on real cloud
      infrastructure.
      Be direct. Be concise. Have opinions.
    agents_md: |
      You are the main agent in a Linode smoke-test deployment.
      Handle day-to-day tasks, questions, and coordination.
      Prefer short answers over long ones.
    identity:
      name: Main
      emoji: "🧠"
    bindings:
      - channel: telegram
        account: telegram-main
