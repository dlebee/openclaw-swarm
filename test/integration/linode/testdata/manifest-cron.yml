# Linode provisioning + security + mesh + gateway + node + agents
# smoke-test manifest that exercises the full cron pipeline end-to-end
# on real cloud infrastructure: scheduler → isolated agent turn → LLM
# call (Ollama on the gateway VM) → tool-call dispatched over the node
# websocket to a remote node (scraper-node) → run persisted with
# status=ok.
#
# Mirror of the Multipass tier's manifest-cron.yml, swapped for Linode
# machine specs (sku / image / region) and the production public_
# hostname strategy (sslip). The meaningful test parameters — one
# gateway (headscale-meshed), one node with exec_policy security:full/
# ask:off, one `reporter` agent with tools.exec pinned to scraper-node,
# ollama-backed model — stay identical so a cron regression that
# manifests on one tier will manifest on the other too.
#
# What this Linode mirror buys over the Multipass cron test:
#
#   - install-caddy + Let's Encrypt ACME. Multipass has no public IP
#     and runs the mesh control URL as plain http://; on Linode the
#     sslip strategy resolves to a real public-routable hostname and
#     Caddy issues a Let's Encrypt cert. A regression in Caddy / ACME
#     / headscale-over-HTTPS interacting with the gateway's LLM
#     discovery or with the cron scheduler's persistence loop would
#     show up here.
#   - headscale + openclaw-node ws over real WireGuard hops across
#     the public internet between two Linode VMs. The node-exec
#     dispatches from the cron-triggered agent ride the same tailnet
#     the production operator's traffic does.
#   - `ollama pull qwen2.5:0.5b` over real egress. Multipass runs
#     against the local disk cache; this tier exercises the real
#     ollama registry + tarball download path. A regression in the
#     openclaw/ollama plugin's handling of slow or chunked downloads
#     would surface here first.
#
# Why g6-standard-4 (4 vCPU / 8 GiB) for the gateway:
#
#   ollama qwen2.5:0.5b peaks ~1.2 GiB RSS during generation on top
#   of the gateway's own ~900 MiB (TypeScript + ts-node subprocess
#   spawns per isolated cron run, same as TestAgentsSmoke's
#   envelope). g6-standard-2 (2 CPU / 4 GiB) is right on the OOM
#   edge when the first cron tick cold-boots a ts-node process
#   simultaneous with ollama generate; standard-4 (4 CPU / 8 GiB)
#   gives ~4 GiB headroom AND doubles vCPU so LLM generate latency
#   stays under 30s per run (avoiding back-pressure from the 5s
#   cron interval stacking behind slow runs). Note: Linode SKUs
#   jump 1 → 2 → 4 → 6 → 8 vCPU; there is no standard-3 SKU.
#   Cost envelope is $0.072/hr vs standard-1's $0.018/hr — pennies
#   per run, worth the OOM safety AND the faster LLM turn.
#
# Why g6-standard-1 for the scraper-host:
#
#   scraper-host only runs openclaw-node (which accepts exec
#   dispatches from the gateway). No LLM, no cron scheduler state.
#   g6-standard-1 (1 CPU / 2 GiB) matches every other Linode fixture
#   so the mechanical shape stays uniform.
#
# Why mode: headscale + strategy: sslip (not custom / not docker):
#
#   sslip is the production default for public-IP deployments
#   (david-army.yml uses it). strategy: custom would need a pre-
#   registered DNS record or a mocked resolver; strategy: docker
#   would skip install-caddy + ACME entirely, weakening the tier's
#   coverage. Keeping sslip here means the cron test rides the
#   same traffic shape a real customer deploy would.
#
# Why exec_policy on the node (unlike manifest-node.yml):
#
#   Identical reasoning to the Multipass tier's manifest-cron.yml —
#   the reporter agent's isolated cron runs dispatch exec tool-
#   calls to scraper-node over the mesh ws. A nil policy would
#   trip ExecPolicyStep.Applicable=false and leave the node's exec
#   handler rejecting the dispatches at runtime. `security: full +
#   ask: off` is the most permissive combo; matches both the
#   docker tier's manifest-cron.yml and the Multipass tier's
#   manifest-cron.yml so the production code path is identical
#   across tiers.

prefix: claws-it-linode-cron

machines:
  - name: gateway-host
    type: linode
    sku: g6-standard-4
    image: linode/ubuntu24.04
    region: us-east
    bootstrap_user: root
    agent_user: agent
  - name: scraper-host
    type: linode
    sku: g6-standard-1
    image: linode/ubuntu24.04
    region: us-east
    bootstrap_user: root
    agent_user: agent

gateways:
  - name: gateway
    reference: gateway-host
    networking:
      mode: headscale
      public_hostname:
        strategy: sslip
      preauth_key_source: file
      preauth_key_file: /var/lib/claws/headscale/preauth.key

nodes:
  - name: scraper-node
    gateway: gateway
    reference: scraper-host
    exec_policy:
      security: full
      ask: "off"

agents:
  - id: reporter
    gateway: gateway
    workspace: ~/.openclaw/workspace
    model: { primary: "ollama/qwen2.5:0.5b" }
    tools:
      exec: { host: node, node: scraper-node, security: full }
    soul: |
      You are a terse reporter for integration testing.
      When asked for a sentence, reply with exactly one short English sentence.
    identity:
      name: Reporter
