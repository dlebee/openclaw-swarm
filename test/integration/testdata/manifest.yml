# Docker integration test manifest.
# No channels, no bindings.
# Gateway + scraper node, two agents: assistant (exec on gateway) and scraper (exec on scraper-node).
#
# host          = how the CLI reaches the machine (localhost + mapped port)
# internal_host = how containers reach each other on the Docker bridge (container name)
#
# Build images first: ./test/infra/build.sh

prefix: integration

machines:
  - name: gateway-host
    type: ssh
    container: true
    host: 127.0.0.1
    internal_host: oc-gateway-test
    ssh_port: 2222
    arch: linux-x64
    agent_user: agent

  - name: scraper-host
    type: ssh
    container: true
    host: 127.0.0.1
    internal_host: oc-scraper-test
    ssh_port: 2223
    arch: linux-x64
    agent_user: agent

gateways:
  - name: gateway
    reference: gateway-host
    networking:
      mode: docker
    openclaw_version: latest

agents:
  - id: assistant
    gateway: gateway
    workspace: ~/.openclaw/workspace
    model: { primary: "ollama/qwen2.5:0.5b" }
    tools:
      exec: { host: gateway, security: full }
      elevated:
        enabled: true
        allow_from:
          telegram: ["admin-chat-123"]
    soul: |
      You are an assistant for integration testing.
      Execute commands when asked. Be concise.
    identity:
      name: Assistant

  - id: scraper
    gateway: gateway
    workspace: ~/.openclaw/workspace
    model: { primary: "ollama/qwen2.5:0.5b" }
    tools:
      exec: { host: node, node: scraper-node, security: full }
    soul: |
      You are a scraper agent for integration testing.
      Scrape and process data when asked. Be concise.
    identity:
      name: Scraper

nodes:
  - name: scraper-node
    gateway: gateway
    reference: scraper-host
    exec_policy:
      security: full
      ask: "off"
