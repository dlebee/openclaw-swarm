prefix: claws-it-multipass-cron

machines:
  - name: gateway-host
    type: multipass
    cpus: 2
    memory: 2G
    disk: 20G
    bootstrap_user: root
    agent_user: agent
  - name: scraper-host
    type: multipass
    cpus: 2
    memory: 2G
    disk: 20G
    bootstrap_user: root
    agent_user: agent

gateways:
  - name: gateway
    reference: gateway-host
    # OPENCLAW_VERSION env var can override this
    openclaw_version: ""
    networking:
      mode: headscale
      public_hostname:
        strategy: custom
        host: "http://claws-it-multipass-cron-gateway-host.local:8080"
      preauth_key_source: file
      preauth_key_file: /var/lib/claws/headscale/preauth.key

nodes:
  - name: scraper-node
    gateway: gateway
    reference: scraper-host
    # OPENCLAW_VERSION env var can override this
    openclaw_version: ""
    exec_policy:
      security: full
      ask: "off"

agents:
  - id: reporter
    gateway: gateway
    workspace: ~/.openclaw/workspace
    model: { primary: "ollama/qwen2.5:0.5b" }
    tools:
      exec: { host: node, node: scraper-node, security: full }
    soul: |
      You are a terse reporter for integration testing.
      When asked for a sentence, reply with exactly one short English sentence.
    identity:
      name: Reporter
